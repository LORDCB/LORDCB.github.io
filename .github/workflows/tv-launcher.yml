name: Build TV launcher

on:
  push:
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so new versions install over old ones.
      # Add repo secrets LAUNCHER_KEYSTORE_BASE64, LAUNCHER_KEYSTORE_PASSWORD,
      # LAUNCHER_KEY_ALIAS and LAUNCHER_KEY_PASSWORD to enable it.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/launcher.jks"
            echo "LAUNCHER_KEYSTORE=$RUNNER_TEMP/launcher.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          LAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
          LAUNCHER_KEY_ALIAS: ${{ secrets.LAUNCHER_KEY_ALIAS }}
          LAUNCHER_KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/home-launcher.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: home-launcher-apk
          path: ${{ runner.temp }}/home-launcher.apk

      # Publishes a release on every build so the TV can download the APK directly from
      # https://github.com/<owner>/<repo>/releases/latest/download/home-launcher.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Home Launcher 1.0.${{ github.run_number }}
          make_latest: true
          files: ${{ runner.temp }}/home-launcher.apk
